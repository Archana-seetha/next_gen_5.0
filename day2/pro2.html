<html>
<head>
<title> list</title>
</head>
<body>
<h1>unordered list</h1>
<ul>
  <li>apple</li>
  <li type="circle"> mango</li>
  <li type="none">orange</li>
 </ul>

<ul type="circle">
  <li>apple</li>
  <li> mango</li>
  <li>orange</li>
 </ul>
<h1> ordered list</h1>

<ol>
  <li>apple</li>
  <li type="i"> mango</li>
  <li type="a">orange</li>
 </ol>

<ol type="A">
  <li>apple</li>
  <li> mango</li>
  <li>orange</li>
 </ol>

<ol type="A" start="24" >
  <li>apple</li>
  <li > mango</li>
  <li >orange</li>
 </ol>


</body>
</html>
