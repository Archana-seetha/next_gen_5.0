<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>program 5</title>
    <link rel="stylesheet" href="index5.css">
</head>
<body>
    <h1>Display Properties</h1>

    <h2>display:block(default)</h2>
  
    <div class="box block">This is a block</div>  
    <div class="box block">this is a block 2</div>

    <h2>display:inline</h2>
    <div class="box inline">Inline css</div>
    <div class="box inline">Inline css 2</div>
    <div class="box inline">Inline css 3</div>

    <h2>display:inline-block</h2>
    <div class="box inline-block">Inline-block 1</div>
    <div class="box inline-block">Inline-block 2</div>
    <div class="box inline-block">Inline-block 3</div>

    <h2>display:none</h2>
    <div class="box none">This box is hidden</div>
</body>
</html>
