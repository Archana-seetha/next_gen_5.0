<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OBJECT DEMO</title>
</head>
<body>
    <h1>JS Object demo</h1>

<script>

    var c=10;
    c=20;
    var c=30;
    console.log("c: " + c);
    document.write("c: " + c + "<br>");

    let a=10;
    a=20;
    // let a=30;
    console.log("a: " + a);
    document.write("a: " + a + "<br>");

    const b=10;
    //  b=1; 
     console.log("b: " + b);
     document.write("b: " + b + "<br>");

     const student = {
        name: "Archana",
        age: 20,
        email:"archanasita811@gmail.com",
        city: "Hyderabad"
     };
     document.write("Name: " + student.name + "<br>");
     document.write("Age: " + student.age + "<br>");
     document.write("Email: " + student.email + "<br>");
     document.write("City: " + student.city + "<br>");





</script>
</body>
</html>
